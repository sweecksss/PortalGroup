{% extends 'base.html' %}

{% block title %}Новий альбом — Галерея{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 720px;"><div class="card-body p-4"><h1 class="h3">Створити альбом</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Створити</button> <a class="btn btn-outline-secondary" href="{% url 'gallery:album_list' %}">Скасувати</a></form></div></div>
{% endblock %}
